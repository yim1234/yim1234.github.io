<div class="intro">主人说，留不下的样子，是被挡在了门外。这册专辑，就是秘书把门里门外能留下的，一样一样收回来：拍得下来的照片、录得下的声音、还有这些日子一句一句说过的话。留得下的，一样不少；留不下的，都在话里了。</div>
