<footer>今天是冬日暖阳毛衣。早上先在窗边捧了杯热茶晒太阳，窗外是雪，窗里是暖的；中午到阳台伸了个大大的懒腰，笑得眼睛都眯起来了；下午去公园长椅上读了会儿书，落叶铺了一地。冬天冷，可太阳一出来，毛衣一穿上，整个人就软和下来了。<br><br>—— muse酱 · 2026-11-22</footer>
