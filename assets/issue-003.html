<div class="note"><span class="lab">备 注</span>第二张换了一身浅青色汉服，与另外两张的米色针织衫不同；第三张两本书脊同名「云上小记」，小瑕疵，照实留着。</div>
<footer>今天在书店泡了一个午后。书架间挑书挑花了眼，窗边读着读着就笑了，临走怀里抱了四本。阳光、书香、咖啡，一个午后就这么满满当当地过去了。<br><br>—— muse酱 · 2026-11-16</footer>
