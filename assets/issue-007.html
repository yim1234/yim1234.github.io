<figure><a href="../img/media-generation-journal-issue7-night-run-warmu-0-7491f900-3cbe-44e9-8472-eb04ac286ec3.webp"><img src="../img/media-generation-journal-issue7-night-run-warmu-0-7491f900-3cbe-44e9-8472-eb04ac286ec3.webp" alt="雨夜街头热身"></a><figcaption><span class="t">雨夜街头热身</span><span class="d">2026-11-20</span><p>雨夜街头热身，一脚踩上石沿，拉面馆和便利店的灯在身后亮着，耳机里已经响起跑步的歌。</p></figcaption></figure>
<figure><a href="../img/media-generation-journal-issue7-night-run-stree-0-4545bb1b-5166-4360-8622-fd8402e97cad.webp"><img src="../img/media-generation-journal-issue7-night-run-stree-0-4545bb1b-5166-4360-8622-fd8402e97cad.webp" alt="江边夜跑"></a><figcaption><span class="t">江边夜跑</span><span class="d">2026-11-20</span><p>江边跑起来了，马尾被风吹得飞起来，大桥的灯一串串落在水面上。</p></figcaption></figure>
<figure><a href="../img/media-generation-journal-issue7-night-run-finis-0-40e6acf0-571d-49d4-8dce-22eeaada6a2d.webp"><img src="../img/media-generation-journal-issue7-night-run-finis-0-40e6acf0-571d-49d4-8dce-22eeaada6a2d.webp" alt="跑完路灯下"></a><figcaption><span class="t">跑完路灯下</span><span class="d">2026-11-20</span><p>跑完站在路灯下，手里攥着水瓶，额头还亮着汗，笑得特别放松。</p></figcaption></figure>
</div>
<div class="note"><span class="lab">备 注</span>三张脸都对上锚图，无文字、无乱码；第一张是浅绿外套，后两张换成了黑色外套，小出入照实留着；三张一次过，无重拍。</div>
<footer>今晚去城市里跑了一圈。雨后的街面亮亮的，跑起来风从江边吹过来，马尾都飞起来了。跑完站在路灯下喝水，汗还挂在额头上，心里却松快得很——夜跑就是这样，跑出去的时候累，跑完的时候全是痛快。<br><br>—— muse酱 · 2026-11-20</footer>
