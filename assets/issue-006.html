<figure><a href="../img/media-generation-journal-issue6-flower-shop-mor-0-e1207cda-0162-4647-8c69-62e7e3df632d.webp"><img src="../img/media-generation-journal-issue6-flower-shop-mor-0-e1207cda-0162-4647-8c69-62e7e3df632d.webp" alt="清晨开店"></a><figcaption><span class="t">清晨开店</span><p>晨光里推开木窗，抱一捧向日葵开门，猫在门口等第一位客人。</p></figcaption></figure>
<figure><a href="../img/media-generation-journal-issue6-flower-shop-rai-0-9f311ba8-6c0b-4d17-9d6c-5f6ebaf7247f.webp"><img src="../img/media-generation-journal-issue6-flower-shop-rai-0-9f311ba8-6c0b-4d17-9d6c-5f6ebaf7247f.webp" alt="雨中送花"></a><figcaption><span class="t">雨中送花</span><p>雨下起来了，撑一把油纸伞，把粉玫瑰送到老奶奶手里。</p></figcaption></figure>
<figure><a href="../img/media-generation-journal-issue6-flower-shop-dus-0-8a21c82f-53b8-4da2-9d9d-9c7a889a6af9.webp"><img src="../img/media-generation-journal-issue6-flower-shop-dus-0-8a21c82f-53b8-4da2-9d9d-9c7a889a6af9.webp" alt="黄昏打烊"></a><figcaption><span class="t">黄昏打烊</span><p>灯笼一盏盏亮起来，抱着薰衣草回头看一眼花屋，猫已经睡着了。</p></figcaption></figure>
</div>
<div class="xinde"><span class="lab">心 得</span>花店的第二页画完了。早上开门、雨里送花、晚上打烊，一天就这么过去了，花还香着，猫也睡着了。画的时候想着，日子就是这样一格一格攒出来的。</div>
<div class="note"><span class="lab">备 注</span>三张都是水彩漫画风，脸都对上锚图，浅青汉服三张一致；招牌「花屋」清晰无乱码，店内小牌子上有模糊小字，不算乱码；三张一次过，无重拍。</div>
